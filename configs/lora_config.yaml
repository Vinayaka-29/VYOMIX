# LoRA / PEFT Training Configuration for SatQuery AI
# Problem Statement: 26167 (ISRO/SAC) | Team Vyomix

# Model Specification
model_checkpoint: "MBZUAI/geochat-7B"
local_fallback_backbone: "Salesforce/blip-vqa-base"
task_type: "CAUSAL_LM"

# Dataset Specification
dataset: "BigEarthNet.txt + VRSBench"
dataset_mode: "smoke"
train_split: 0.8
validation_split: 0.2
seed: 42

# Image Preprocessing
image_resolution: 336
channels: 3
percentile_stretch: [2, 98]

# Optimization & Training Hyperparameters (Conservative Defaults for Smoke Verification)
batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 0.0002
weight_decay: 0.01
epochs: 1
max_seq_length: 512
warmup_ratio: 0.05
lr_scheduler_type: "cosine"

# LoRA / PEFT Parameters
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "v_proj"
  - "k_proj"
  - "o_proj"
bias: "none"

# Precision & Hardware
quantization: "4-bit"  # Options: '4-bit', '8-bit', 'none'
dtype: "bfloat16"      # Options: 'float16', 'bfloat16', 'float32'
device_map: "auto"

# Serialization
output_directory: "backend/models/checkpoints/lora_adapter"
save_safetensors: true
logging_steps: 5
